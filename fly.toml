# Fly.io 배포 설정 — 렌트베네핏 서버(API)
#
# 도쿄(nrt)에 둔다. 데이터베이스(MongoDB Atlas)가 도쿄에 있어서, 서버도 도쿄면
# 서버와 DB가 같은 도시라 주고받는 시간이 거의 사라진다.
# 예전 서버는 미국에 있어 요청마다 태평양을 왕복했다.

app = "rentbenefit-api"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # 서버를 재우지 않는다.
  #
  # 이 서버는 정해진 시각에 스스로 하는 일이 있다(아웃룩 연락처 6시간마다,
  # 청구서 발송 일정 매일 새벽 3시 10분, 고지서 납부기한 3시 20분).
  # 아무도 안 쓴다고 재우면 그 시각에 깨어 있지 않아 일이 밀린다.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
